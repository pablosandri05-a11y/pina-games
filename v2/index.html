<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="common.css"><script src="common.js"></script>
<style>.g{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 14px;margin-top:10px;text-decoration:none;color:var(--ink);border-left:8px solid var(--gc);box-shadow:0 3px 0 #E3E4EE}
.g svg{width:64px;flex:none}.g b{font-family:'Baloo 2';font-size:20px;display:block;line-height:1.1}.g span{font-size:14px;color:var(--muted);font-weight:600}
.g .n{font-family:'Baloo 2';font-weight:800;font-size:26px;color:var(--gc);width:30px}</style></head><body>
<script>
const G=[[1, "#2F7BEA", {"en": "Where does AI live?", "sl": "Kje živi UI?"}], [2, "#F2711C", {"en": "What is AI good at?", "sl": "V čem je UI dobra?"}], [3, "#7B4FE0", {"en": "Does AI think like a human?", "sl": "Ali UI razmišlja kot človek?"}], [4, "#E63E62", {"en": "Can AI make mistakes?", "sl": "Ali se UI lahko zmoti?"}], [5, "#0FA36B", {"en": "How does AI learn?", "sl": "Kako se UI uči?"}], [6, "#2F7BEA", {"en": "Should you trust AI?", "sl": "Ali lahko zaupaš UI?"}], [7, "#F2711C", {"en": "Who is responsible?", "sl": "Kdo je odgovoren?"}], [8, "#7B4FE0", {"en": "Can AI know what is fair?", "sl": "Ali UI ve, kaj je pravično?"}], [9, "#E63E62", {"en": "Should AI choose for you?", "sl": "Ali naj UI izbira namesto tebe?"}], [10, "#0FA36B", {"en": "Can AI keep a secret?", "sl": "Ali UI zna varovati skrivnost?"}], [11, "#2F7BEA", {"en": "How do you talk to AI?", "sl": "Kako govoriti z UI?"}], [12, "#F2711C", {"en": "Can you tell if AI made it?", "sl": "Ali prepoznaš, da je naredila UI?"}], [13, "#7B4FE0", {"en": "Does AI use energy?", "sl": "Ali UI porablja energijo?"}], [14, "#E63E62", {"en": "Where does AI bias come from?", "sl": "Od kod pride pristranskost UI?"}], [15, "#0FA36B", {"en": "Can AI be creative?", "sl": "Ali je UI lahko ustvarjalna?"}], [16, "#2F7BEA", {"en": "What happens to your data?", "sl": "Kaj se zgodi s tvojimi podatki?"}], [17, "#F2711C", {"en": "Should AI help you study?", "sl": "Ali naj ti UI pomaga pri učenju?"}], [18, "#7B4FE0", {"en": "Will AI change jobs?", "sl": "Ali bo UI spremenila poklice?"}]];
const LV=[[1,10,{en:"Level 1 · Beginner",sl:"Stopnja 1 · Začetniki"}],[11,18,{en:"Level 2 · Intermediate",sl:"Stopnja 2 · Nadaljevalci"}]];
shell({n:0,color:'#1F2A55',tint:'#ECEEF6',title:{en:'AI Literacy Cards',sl:'Kartice o umetni inteligenci'}});
document.querySelector('.pill').textContent='PiNA';dots(1,-1);document.querySelector('.foot').innerHTML=esc(L(COMMON.credit));
show(`<h1>${L({en:'AI Literacy Games',sl:'Igre o umetni inteligenci'})}</h1><p class="lead">${L({en:'One game for each card',sl:'Ena igra za vsako kartico'})}</p>`+
LV.map(([a,b,lab])=>`<h2 style="margin-top:18px;font-size:22px">${L(lab)}</h2>`+G.filter(g=>g[0]>=a&&g[0]<=b).map(([n,c,t])=>`<a class="g" style="--gc:${c}" href="game${n}.html?lang=${LANG}#${LANG}"><span class="n">${n}</span>${svg(80,80,robot(40,48,.9,c))}<div><b>${esc(L(t))}</b></div></a>`).join('')).join(''));
</script></body></html>
