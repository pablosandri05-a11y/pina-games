const CFG={n:4,color:'#E63E62',tint:'#FDE8ED',title:{en:'Can AI make mistakes?',sl:'Ali se UI lahko zmoti?'}};
const C=CFG.color;
const ROUNDS=[
 {img:'muffin',say:{en:'It’s a dog!',sl:'To je pes!'},conf:99,right:false,truth:{en:'It is a blueberry muffin! The blur made the berries look like eyes and a nose.',sl:'To je borovničev mafin! Zaradi zameglitve so borovnice videti kot oči in nos.'}},
 {img:0,say:{en:'It’s a basketball!',sl:'To je košarkarska žoga!'},conf:92,right:false,truth:{en:'It is an orange. Round and orange is not enough to be sure.',sl:'To je pomaranča. Okroglo in oranžno ni dovolj, da bi bili prepričani.'}},
 {img:2,say:{en:'It’s a cup, seen from above.',sl:'To je skodelica, gledana od zgoraj.'},conf:64,right:true,truth:{en:'Right! And notice: the AI was only 64% sure, but it was correct.',sl:'Prav! In opazi: UI je bila prepričana le 64 %, pa je imela prav.'}},
 {img:3,say:{en:'It’s a barcode!',sl:'To je črtna koda!'},conf:95,right:false,truth:{en:'It is a zebra, very close up. Without the whole picture, stripes are just stripes.',sl:'To je zebra od zelo blizu. Brez cele slike so črte samo črte.'}},
 {img:1,say:{en:'It’s an empty box.',sl:'To je prazna škatla.'},conf:97,right:false,truth:{en:'There is a cat hiding behind it! The AI only described what it could see.',sl:'Za njo se skriva mačka! UI je opisala samo tisto, kar je videla.'}},
 {img:5,say:{en:'It’s a teapot.',sl:'To je čajnik.'},conf:58,right:true,truth:{en:'Correct, it is a teapot’s shadow. Again: low confidence, right answer.',sl:'Pravilno, to je senca čajnika. Spet: nizka gotovost, pravilen odgovor.'}},
 {img:4,say:{en:'They’re glasses!',sl:'To so očala!'},conf:88,right:false,truth:{en:'It is a bicycle with parts missing. Incomplete pictures fool AI easily.',sl:'To je kolo, ki mu manjkajo deli. Nepopolne slike UI zlahka zavedejo.'}}];
const S={introT:{en:'Mistake Hunter',sl:'Lovec na napake'},
 intro:{en:'Our robot looks at tricky pictures and tells you what it sees, and how sure it is. Your job: is the robot right or wrong?',sl:'Naš robot gleda zvijačne slike in pove, kaj vidi in kako prepričan je. Tvoja naloga: ima robot prav ali ne?'},
 sure:{en:'sure',sl:'prepričan'},right:{en:'Robot is right',sl:'Robot ima prav'},wrong:{en:'Robot is wrong',sl:'Robot se moti'},
 gotIt:{en:'Good hunting!',sl:'Dober lov!'},missed:{en:'Missed that one!',sl:'Tega si zgrešil(a)!'},
 endT:{en:'Mistakes found',sl:'Najdene napake'},yours:{en:'Your score',sl:'Tvoj rezultat'},
 lesson:{en:'The robot was wrong 5 times out of 7, and it was most sure exactly when it was wrong. Sounding sure is not the same as being right.',sl:'Robot se je zmotil 5-krat od 7, in najbolj prepričan je bil prav takrat, ko se je motil. Biti prepričan ne pomeni imeti prav.'},
 tips:{en:'Check an AI answer when: the picture or question is unclear · it matters (health, homework, news) · something feels strange.',sl:'Preveri odgovor UI, ko: je slika ali vprašanje nejasno · je pomembno (zdravje, domača naloga, novice) · se ti kaj zdi čudno.'},
 big:{en:'AI does not know, it predicts what is most likely. Blurry, hidden or unusual information can fool it. A fast, confident answer still needs checking.',sl:'UI ne ve, temveč napove, kaj je najbolj verjetno. Zamegljeni, skriti ali nenavadni podatki jo lahko zavedejo. Tudi hiter in samozavesten odgovor je treba preveriti.'}};
let k=0,score=0;shell(CFG);

<div class="spacer"></div><button class="btn" onclick="round()">${L(COMMON.start)}</button>`)}

 show(`<span class="tag">${k+1}/${ROUNDS.length}</span><div class="pic" id="pic">${IMG[x.img][0]}</div>

 <div class="choices two"><button class="choice" id="b1" onclick="ans(true)">✓ ${L(S.right)}</button><button class="choice" id="b0" onclick="ans(false)">✗ ${L(S.wrong)}</button></div><div id="fb"></div>`);
 setTimeout(()=>$('#m').style.width=x.conf+'%',60)}
